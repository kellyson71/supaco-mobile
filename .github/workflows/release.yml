name: Release

# Crie uma tag (ex.: v2.0) para gerar o APK assinado e o GitHub Release.
# Secrets necessários: SUPACO_KEYSTORE_BASE64, SUPACO_STORE_PASSWORD,
# SUPACO_KEY_ALIAS, SUPACO_KEY_PASSWORD.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore
        run: echo "${{ secrets.SUPACO_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Testes e APK assinado
        env:
          SUPACO_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SUPACO_STORE_PASSWORD: ${{ secrets.SUPACO_STORE_PASSWORD }}
          SUPACO_KEY_ALIAS: ${{ secrets.SUPACO_KEY_ALIAS }}
          SUPACO_KEY_PASSWORD: ${{ secrets.SUPACO_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Renomear e gerar checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "supaco-v${VERSION}.apk"
          sha256sum "supaco-v${VERSION}.apk" > "supaco-v${VERSION}.apk.sha256"

      - name: Mapping do R8 (para ler stack traces)
        uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            supaco-v*.apk
            supaco-v*.apk.sha256
