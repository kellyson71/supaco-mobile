name: Bug
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "⚠️ Nunca cole sua senha, token ou prints com dados pessoais. Falhas de segurança: veja SECURITY.md."
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu?
      description: E o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: "1. Abra a aba Matérias\n2. Toque em...\n3. ..."
  - type: input
    id: versao-app
    attributes:
      label: Versão do Supaco
      description: Configurações → Sobre
      placeholder: "2.0"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Aparelho e versão do Android
      placeholder: "Moto G54, Android 14"
    validations:
      required: true
  - type: dropdown
    id: curso
    attributes:
      label: Tipo de curso
      options: [Técnico integrado, Técnico subsequente, Superior, Outro]
